<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/input.css">

    <title>CALCULADORA</title>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen m-auto min-w-sm max-w-xl">
    <section id="calculator" class="bg-slate-800 text-white rounded-3xl p-6 text-center shadow-2xl">
        <!--DISPLAY-->
        <input type="text" id="display" disabled class="bg-slate-700 rounded-xl text-white mb-10 p-2 text-5xl max-w-sm shadow-xl">
        <br>
        <section class="botones grid grid-cols-4 grid-rows-5 gap-2 text-xl">
            <!--OPERADORES-->
            <button id="ac" class="operator bg-yellow-700 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-yellow-800 transition">AC</button>
            <button id="de" class="operator bg-yellow-600 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-yellow-700 transition">DE</button>
            <button id="/" class="operator bg-slate-600 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-700 transition">/</button>
            <button id="*" class="operator bg-slate-600 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-700 transition">*</button>
            <!--NUMEROS-->
            <button id="7" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">7</button>
            <button id="8" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">8</button>
            <button id="9" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">9</button>
            <button id="-" class="operator bg-slate-600 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-700 transition">-</button>
            <button id="4" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">4</button>
            <button id="5" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">5</button>
            <button id="6" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">6</button>
            <button id="+" class="operator bg-slate-600 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-700 transition">+</button>
            <button id="1" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">1</button>
            <button id="2" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">2</button>
            <button id="3" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">3</button>
            
            <button id="=" class="operator equal bg-slate-700 rounded-2xl p-5 row-span-2 shadow-xl active:scale-95 active:bg-slate-800 transition">=</button>
            <button id="0" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">0</button>
            <button id="00" class="bg-slate-500 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-600 transition">00</button>
            <button id="." class="operator bg-slate-600 rounded-2xl p-5 shadow-xl active:scale-95 active:bg-slate-700 transition">.</button>
        </section>
    </section>

    <script src="assets/js/app.js"></script>
</body>
</html>
